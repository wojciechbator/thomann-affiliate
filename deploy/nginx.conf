server {
    listen 443 ssl;
    server_name thomann.virya.music;

    ssl_certificate     /var/lib/thomann-affiliate/lego/certificates/thomann.virya.music.crt;
    ssl_certificate_key /var/lib/thomann-affiliate/lego/certificates/thomann.virya.music.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:THOMANN_TLS:10m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    root /srv/thomann-affiliate;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, s-maxage=3600, max-age=300" always;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name thomann.virya.music;
    return 301 https://$host$request_uri;
}
